name: Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  semver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The check compares package.json with the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Shipped changes raise the version
        run: node scripts/version-check.mjs --base "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies
        run: node .yarn/releases/yarn-4.18.0.cjs install --immutable
      - name: Format and lint
        run: node .yarn/releases/yarn-4.18.0.cjs biome ci .
      - name: Type-check
        run: node .yarn/releases/yarn-4.18.0.cjs tsc --noEmit
      - name: Unused files, exports and dependencies
        run: node .yarn/releases/yarn-4.18.0.cjs knip --no-progress
